name: Keep Render API awake

on:
  schedule:
    # A cada 10 min — folga confortável sob o limite de 15 min de
    # inatividade do plano free do Render, que suspenderia o processo
    # (e junto dele a thread do consumer MQTT em background).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -sf --max-time 30 https://methane-co2-tracker-api.onrender.com/health
